name: Publish to npm

# Publishes on every push to main, but only when package.json's version
# isn't already on the registry — so pushes that don't bump the version
# are no-ops instead of failing on a duplicate-publish error.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. This only
# works once the package exists on npm and a Trusted Publisher is
# configured for it at https://www.npmjs.com/package/<name>/access
# pointing at this repo + this workflow filename.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - src/**
      - app.plugin.js

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm CLI (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check whether this version is already published
        id: version-check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION}"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version-check.outputs.published == 'false'
        run: npm ci

      - name: Build
        if: steps.version-check.outputs.published == 'false'
        run: npm run build

      - name: Publish
        if: steps.version-check.outputs.published == 'false'
        run: npm publish
